name: Security

# The same checks as Will413028/fullstack-template, called at a pinned commit so a fix there reaches this repository
# through one pin update: actionlint + zizmor, gitleaks over the whole history, and osv-scanner over the lockfiles
# named here. The weekly run rescans the default branch (dev, which contains all of main), since malicious-package records often appear after a version is already
# in a lockfile; scheduled runs get only the vulnerability scan.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: Will413028/fullstack-template/.github/workflows/security.yml@2ccba69ee89ec4937a1e387006bc816da42d4518 # v1.0.0
    with:
      osv-scan-args: -L backend/uv.lock -L web/pnpm-lock.yaml

  gate:
    # The only required check on main: it passes when every other job in this workflow succeeded or was skipped.
    name: gate (security)
    if: always()
    needs: [security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a needed job ended with: $r"; exit 1 ;; esac
          done
