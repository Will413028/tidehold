name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the lock history check walks the pushed commits
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          enable-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: uv sync --project backend --frozen
      - run: pnpm --dir web install --frozen-lockfile
      # system libraries for Chromium; make e2e downloads the browser itself
      - run: pnpm --dir web exec playwright install-deps chromium
      - run: make ci
      - name: A commit that loosens quality-lock.json says why
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/quality_lock.py history "$BASE"
      - run: pnpm --dir web build
