[project]
name = "tidehold"
version = "0.1.0"
description = "Weather-cancellation deposits for dive operators"
requires-python = ">=3.13,<3.14"
dependencies = [
    "defusedxml>=0.7.1,<0.8",
    "fastapi>=0.143,<1",
    "httpx2>=2.13,<3",
    "psycopg[binary]>=3.3,<4",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "import-linter>=2.15,<3",
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "pytest-randomly>=5.0,<6",
    "ruff>=0.17,<0.18",
    "testcontainers>=4.15,<5",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Resolve only releases at least a week old, so a compromised release has time to be yanked.
exclude-newer = "1 week"
# A security fix is not held back by that week (AGENTS.md): each entry lets one package resolve releases up to the
# given time and names the advisory it fixes. Remove an entry once its release is older than a week.
# certifi 2026.10.19 (uploaded 2026-10-20): PYSEC-2026-4320 / GHSA-6q48-6c7w-9gw2, critical, compromised emSign CA.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PGH", "ASYNC", "PT", "TID",
    "C90", "PLR09", "BLE", "DTZ", "FBT", "TRY", "PLW0603",
]
# TRY003: a message at the raise site (HTTPException("no such trip")) is the house style.
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
# S101: assert is how pytest checks.
"tests/**" = ["S101"]
# The one module that reads the environment.
"src/tidehold/platform/settings.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Read configuration through tidehold.platform.settings."
"os.getenv".msg = "Read configuration through tidehold.platform.settings."

[tool.mypy]
python_version = "3.13"
strict = true
enable_error_code = [
    "exhaustive-match", "ignore-without-code", "possibly-undefined", "redundant-expr", "truthy-bool",
]
packages = ["tidehold", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["testcontainers.*", "defusedxml.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "tidehold"

[[tool.importlinter.contracts]]
name = "Layers: a module imports only modules below it; modules in one layer are independent"
type = "layers"
containers = ["tidehold"]
# A new top-level module must be placed in a layer before it can be imported.
exhaustive = true
layers = [
    "bootstrap",
    "settlement",
    "holds",
    "trips",
    "policy",
    "warnings | money | identity",
    "platform",
]
