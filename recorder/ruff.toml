# Stdlib-only scripts deployed to the VM's system Python (3.12), tested with unittest.
# Not under `ruff format`: it would rewrite most lines of scripts that retire after the demo.
line-length = 120
target-version = "py312"

[lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PGH", "TID",
    "C90", "PLR09", "BLE", "DTZ", "FBT", "TRY", "PLW0603",
]
ignore = ["TRY003"]
