# Pushes go to dev, and pre-push is where a change is stopped first; CI is the backup, and
# the only place the container and browser suites (`make integration`, `make e2e`) run.
# Install once per clone: `lefthook install` (with a global core.hooksPath that dispatches to
# .git/hooks: `GIT_CONFIG_GLOBAL=/dev/null lefthook install`).
pre-push:
  commands:
    check:
      run: make check
    security:
      run: make security
    # A commit that loosens quality-lock.json must say why (Quality-lock-reason: line).
    locks-history:
      run: python3 scripts/quality_lock.py history origin/main
